[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbproject"
version = "1.0.0"
description = "Reproducible RAVDESS face and voice authentication experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.26.4", "scipy==1.15.3", "pandas==2.2.3",
  "matplotlib==3.10.3", "scikit-learn==1.6.1",
  "opencv-python-headless==4.11.0.86", "speechbrain==1.0.3",
  "huggingface-hub==0.30.2", "soundfile==0.13.1",
  "PyYAML==6.0.2", "tqdm==4.67.1",
]

[project.scripts]
mbproject = "mbproject.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
